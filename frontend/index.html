<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Student Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--c1:#7c2ddb;--c2:#e8399b;--c3:#ff7a1a;--acc:#f97316;--bg:#faf6f1;--card:#fff;--ink:#17141f;--mut:#8b8478;--line:#efe7dd;--tint:#f4efe8;--ok:#12a36b;--bad:#e5484d;--warn:#d99a00}
html[data-dark]{--bg:#14121a;--card:#1d1a26;--ink:#f3f0fa;--mut:#9a94ab;--line:#2c2838;--tint:#262232}
*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:12px 14px}
.top h1{font-size:17px;font-weight:700;flex:1;margin-left:6px}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.ib:active{background:var(--tint)}
main{flex:1;padding:16px 16px 76px;display:flex;flex-direction:column;gap:14px}
.foot{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--card);border-top:1px solid var(--line);text-align:center;font-size:12px;color:var(--mut);padding:13px;z-index:10}
.foot b{background:linear-gradient(90deg,var(--c1),var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.hero{border-radius:20px;padding:20px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2) 55%,var(--c3));display:grid;grid-template-columns:1fr 128px;gap:12px;box-shadow:0 10px 28px -12px var(--c2)}
.hero .date{font-size:11px;letter-spacing:.06em;opacity:.8;grid-column:1/-1}
.hero h2{font-size:26px;line-height:1.1;font-weight:800;margin:2px 0 8px}
.hero p{font-size:13px;opacity:.92;line-height:1.45}
.hero .acts{display:flex;flex-direction:column;gap:8px;align-items:flex-start;margin-top:14px}
.hero .side{display:flex;flex-direction:column;gap:10px}
.glass{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:14px;padding:10px 12px}
.glass small{display:block;font-size:10px;opacity:.85;letter-spacing:.04em}
.glass b{display:block;font-size:22px;margin-top:2px}
.glass i{font-style:normal;font-size:11px;opacity:.85}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border-radius:11px;font-weight:700;font-size:13px;background:var(--acc);color:#fff}
.btn.white{background:#fff;color:#b8400a}
.btn.ghost{background:rgba(255,255,255,.22);color:#fff;border:1px solid rgba(255,255,255,.35)}
.btn.line{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:12px}
.btn:disabled{opacity:.45}
.stat{display:flex;flex-direction:column;gap:6px}
.stat .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;margin-bottom:6px}
.stat b{font-size:30px;font-weight:800;line-height:1}
.stat span{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.04em;text-transform:uppercase}
.stat small{font-size:12px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sec{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sec h3{font-size:16px;font-weight:700}
.link{color:var(--acc);font-weight:700;font-size:13px}
.big{text-align:center;padding:6px 0}
.big b{font-size:44px;font-weight:800;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--tint);color:var(--mut)}
.pill.ok{background:#e3f6ee;color:var(--ok)}.pill.bad{background:#fdeaea;color:var(--bad)}.pill.warn{background:#fff3d6;color:var(--warn)}.pill.pu{background:#efe8fc;color:var(--c1)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:10px}
.mini b{display:block;font-size:22px}.mini span{font-size:11px;color:var(--mut)}
.bar{height:8px;border-radius:9px;background:var(--tint);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--ok)}
.kv{display:flex;justify-content:space-between;font-size:13px;margin:10px 0 6px}
.ring{--p:70;--col:var(--ok);width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--col) calc(var(--p)*1%),var(--tint) 0);display:grid;place-items:center;flex:none}
.ring span{width:35px;height:35px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:11px;font-weight:800}
.trow{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0;padding-top:4px}
.trow h4{font-size:15px;font-weight:700}
.trow p{font-size:12px;color:var(--mut);margin:3px 0 8px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.search{display:flex;gap:8px}
.search label{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--mut)}
.search input{border:0;background:none;outline:0;padding:11px 0;width:100%;font-size:14px}
.chips{display:flex;gap:8px;overflow:auto;padding-bottom:2px}
.chip{padding:7px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:700;white-space:nowrap;color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pager{display:flex;justify-content:center;align-items:center;gap:14px;font-size:13px;color:var(--mut);padding-top:12px;border-top:1px solid var(--line)}
.cover{height:130px;border-radius:12px;background:linear-gradient(135deg,var(--c1),var(--c2) 60%,var(--c3));display:flex;align-items:flex-end;padding:12px;color:#fff;font-weight:800;font-size:22px;margin-bottom:12px;position:relative}
.cover em{position:absolute;top:10px;left:10px;font-style:normal;font-size:11px;font-weight:700;background:rgba(255,255,255,.25);padding:3px 9px;border-radius:99px}
.person{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin:6px 0 10px}
.av{width:26px;height:26px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.folder{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.folder .fi{width:38px;height:38px;border-radius:10px;background:#fff0e3;color:var(--acc);display:grid;place-items:center;flex:none}
.folder b{display:block;font-size:14px}.folder small{color:var(--mut);font-size:12px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.lrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.rk{width:30px;height:30px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.lrow.me{background:#fff3e8;margin:0 -8px;padding:11px 8px;border-radius:10px}
html[data-dark] .lrow.me{background:#2d2231}
.gold{background:linear-gradient(135deg,#fff8e1,#fff1c7);border-color:#f1d36b;color:#3b2f00}
.q h3{font-size:18px;line-height:1.35;margin:10px 0 16px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:13px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--card);font-size:14px}
.opt i{width:26px;height:26px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px;flex:none}
.opt.sel{border-color:var(--acc);background:#fff3e8;color:#17141f}
.opt.right{border-color:var(--ok);background:#e3f6ee;color:#0d6e49}
.opt.wrong{border-color:var(--bad);background:#fdeaea;color:#a02126}
.qimg{display:block;max-width:100%;max-height:320px;object-fit:contain;border-radius:10px;border:1px solid var(--line);background:#fff;margin:8px 0}
.opt .ot{flex:1;min-width:0}
.opt .ot .qimg{max-height:200px;margin:8px 0 0}
.imgbox{margin:2px 0 12px}
.imgbox .qimg{max-height:150px;margin:6px 0}
.imgbox .btn{margin-right:6px}
#zoomov{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99999;display:flex;align-items:center;justify-content:center;padding:12px}
#zoomov img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;background:#fff}
.empty{text-align:center;color:var(--mut);padding:28px 10px;font-size:14px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;font-size:12px;font-weight:700;color:var(--mut)}
.f input:not([type=checkbox]):not([type=color]),.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:500;color:var(--ink);width:100%}
.f input[type=color]{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:3px}
.sw{display:flex;align-items:center;gap:10px;font-size:14px;padding:8px 0}
.sw input{width:18px;height:18px;accent-color:var(--acc)}
.ov{position:fixed;inset:0;background:rgba(10,8,18,.5);z-index:40;display:flex;justify-content:flex-start}
.drawer{width:292px;max-width:84%;background:var(--card);height:100%;display:flex;flex-direction:column;animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(-100%)}}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;background:linear-gradient(90deg,var(--c1),var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .lg{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--c1),var(--c3));display:grid;place-items:center;color:#fff;font-size:11px;-webkit-text-fill-color:#fff}
.logo img{width:30px;height:30px;border-radius:9px;object-fit:cover}
.nav{flex:1;overflow:auto;padding:10px}
.nav button{display:flex;gap:14px;align-items:center;width:100%;padding:12px;border-radius:11px;font-size:14px;font-weight:600;color:var(--mut);text-align:left}
.nav button.on{background:#fff0e3;color:var(--acc)}
html[data-dark] .nav button.on{background:#32232a}
.me-box{display:flex;gap:11px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);font-size:13px}
.me-box small{display:block;color:var(--mut);font-size:11px;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.ava{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.sheet{position:fixed;inset:auto 0 0 0;margin:0 auto;max-width:520px;height:92dvh;background:var(--card);border-radius:22px 22px 0 0;z-index:50;display:flex;flex-direction:column;animation:up .24s ease-out}
@keyframes up{from{transform:translateY(100%)}}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 8px}
.sheet .sh h2{font-size:18px}
.tabs{display:flex;gap:6px;overflow:auto;padding:4px 18px 10px;border-bottom:1px solid var(--line)}
.sb{flex:1;overflow:auto;padding:16px 18px 30px}
.rowed{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.rowed .rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:var(--mut);font-size:12px}
.rowed .rh button{color:var(--bad);padding:4px}
.hint{font-size:12px;color:var(--mut);margin:0 0 12px;line-height:1.5}
textarea.code{min-height:150px;font-family:ui-monospace,monospace;font-size:12px}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:#17141f;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:70;max-width:86%;text-align:center}
.login{min-height:100dvh;display:grid;place-items:center;padding:24px}
.login .card{width:100%;max-width:380px;padding:26px}
.login h2{font-size:24px;margin:16px 0 4px}
.login p{color:var(--mut);font-size:14px;margin-bottom:18px}
.sbar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px}
.sbar img,.sbar .lg{width:34px;height:34px;border-radius:9px;object-fit:cover;flex:none}
.sbar .lg{background:linear-gradient(135deg,var(--c1),var(--c3));display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800}
.sbar b{font-size:14px;display:block;line-height:1.2}.sbar small{color:var(--mut);font-size:11px}
.lgprev{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.lgprev img,.lgprev .lg{width:64px;height:64px;border-radius:14px;object-fit:cover;border:1px solid var(--line);background:var(--tint)}
.lgprev .lg{display:grid;place-items:center;font-weight:800;color:var(--mut)}
.wlc{position:fixed;inset:0;z-index:90;background:rgba(10,8,18,.62);display:grid;place-items:center;padding:24px;animation:fade .25s ease-out}
@keyframes fade{from{opacity:0}}
.wlc .box{background:var(--card);border-radius:24px;padding:28px 22px;max-width:360px;width:100%;text-align:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.wlc img,.wlc .lg{width:92px;height:92px;border-radius:22px;object-fit:cover;margin:0 auto 14px;display:block}
.wlc .lg{background:linear-gradient(135deg,var(--c1),var(--c3));display:grid;place-items:center;color:#fff;font-size:30px;font-weight:800}
.wlc h2{font-size:24px;margin-bottom:4px}.wlc p{color:var(--mut);font-size:14px;margin-bottom:16px;line-height:1.5}
.hq{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.hq summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.hq summary::-webkit-details-marker{display:none}
.hq summary::after{content:'+';font-size:20px;color:var(--acc);font-weight:700;flex:none}
.hq[open] summary::after{content:'\2212'}
.hq .ans{padding:0 14px 14px;font-size:14px;line-height:1.6;color:var(--ink);white-space:pre-line}
.hh{font-size:13px;font-weight:800;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;margin:6px 0 10px}
@media (prefers-reduced-motion:reduce){.wlc,.wlc .box{animation:none}}
@media (prefers-reduced-motion:reduce){.drawer,.sheet{animation:none}}
@media (max-width:360px){.hero{grid-template-columns:1fr}}

.chgrp{margin:10px 0 4px}.chh{display:flex;align-items:center;justify-content:space-between;margin:6px 0}
.chrow{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;margin:6px 0;border:1px solid var(--line);border-radius:12px;background:transparent;color:inherit;font:inherit;font-size:14px;cursor:pointer}
.chrow small{color:var(--mut);font-size:12px;white-space:nowrap}
.chrow.on{border-color:var(--acc);background:var(--tint)}
.chrow:disabled{opacity:.45;cursor:default}
.chrow .chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff}
.chrow.on .chk{background:var(--acc);border-color:var(--acc)}
.nfpdf{display:flex;align-items:center;gap:10px;width:100%;margin:6px 0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:transparent;color:inherit;font:inherit;font-size:13px;cursor:pointer;text-align:left}
.nfpdf span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nfpdf small{color:var(--mut);white-space:nowrap}
.nfimgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.nfimgs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.lbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
.lbox img{max-width:100%;max-height:80vh;object-fit:contain;border-radius:8px}

/* =====================================================================
   PRO THEME v4  -  shadows, animations, cover hero, new login, welcome
   ===================================================================== */
:root{--sh1:0 1px 2px rgba(23,20,31,.05),0 3px 10px -3px rgba(23,20,31,.08);--sh2:0 2px 4px rgba(23,20,31,.04),0 12px 26px -10px rgba(23,20,31,.18);--sh3:0 24px 50px -18px rgba(23,20,31,.38);--ease:cubic-bezier(.22,.8,.24,1)}
html[data-dark]{--sh1:0 1px 2px rgba(0,0,0,.35),0 3px 10px -3px rgba(0,0,0,.4);--sh2:0 12px 26px -10px rgba(0,0,0,.55);--sh3:0 24px 50px -18px rgba(0,0,0,.7)}
html{scroll-behavior:smooth}
body{-webkit-font-smoothing:antialiased;background-image:radial-gradient(900px 420px at 100% -8%,color-mix(in srgb,var(--c1) 11%,transparent),transparent 62%),radial-gradient(700px 380px at -8% 4%,color-mix(in srgb,var(--c3) 10%,transparent),transparent 62%);background-attachment:fixed}

/* keyframes */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
@keyframes floaty{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-14px) scale(1.04)}}
@keyframes gshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes kenburns{to{transform:scale(1.13) translate(-1.5%,-1%)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,14px)}}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(var(--r))}100%{opacity:.9;transform:translateY(112vh) rotate(calc(var(--r) + 560deg))}}
@keyframes dash{to{stroke-dashoffset:0}}
@keyframes dots{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}

/* page transition: sirf tab chalta hai jab page (route) badalta hai */
main.enter>*{animation:rise .55s var(--ease) both}
main.enter>*:nth-child(2){animation-delay:.05s}main.enter>*:nth-child(3){animation-delay:.1s}main.enter>*:nth-child(4){animation-delay:.15s}
main.enter>*:nth-child(5){animation-delay:.2s}main.enter>*:nth-child(6){animation-delay:.25s}main.enter>*:nth-child(7){animation-delay:.3s}
main.enter>*:nth-child(8){animation-delay:.34s}main.enter>*:nth-child(n+9){animation-delay:.38s}
main.enter .bar i,main.enter .stk i{animation:grow 1.1s var(--ease) .3s both}

/* top bar, cards, buttons */
.top{background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);box-shadow:0 8px 24px -16px rgba(23,20,31,.35)}
.top h1{letter-spacing:-.01em}
.ib{transition:background .2s,transform .15s}.ib:hover{background:var(--tint)}.ib:active{transform:scale(.9)}
.card{box-shadow:var(--sh1);border-color:color-mix(in srgb,var(--line) 80%,transparent);transition:box-shadow .3s var(--ease),transform .3s var(--ease),border-color .3s}
@media (hover:hover){.card:hover{box-shadow:var(--sh2)}.folder:hover,.chrow:hover:not(:disabled),.opt:hover{transform:translateY(-2px);box-shadow:var(--sh2)}}
.folder,.opt,.chrow,.chip,.lrow{transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .2s,border-color .2s,color .2s}
.btn{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 62%,var(--c2)));box-shadow:0 10px 20px -10px var(--acc);transition:transform .2s var(--ease),box-shadow .25s,filter .2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06);box-shadow:0 16px 26px -10px var(--acc)}
.btn:active{transform:translateY(0) scale(.96);box-shadow:0 4px 10px -6px var(--acc)}
.btn.white,.btn.line{box-shadow:var(--sh1)}.btn.ghost{box-shadow:none}
.btn.white:hover,.btn.line:hover{box-shadow:var(--sh2)}
.btn.busy{opacity:.7;pointer-events:none}
.chip.on{box-shadow:0 8px 16px -8px var(--acc)}
.opt.sel{box-shadow:0 8px 18px -10px var(--acc)}
.pill{letter-spacing:.01em}
.f input:not([type=checkbox]):not([type=color]),.f select,.f textarea{transition:border-color .2s,box-shadow .2s,background .2s}
.f input:not([type=checkbox]):not([type=color]):focus,.f select:focus,.f textarea:focus{outline:0;border-color:var(--acc);background:var(--card);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent)}
.badge{box-shadow:0 8px 16px -8px var(--c2)}
.toast{animation:toastin .35s var(--ease);box-shadow:var(--sh3)}
.empty{animation:rise .5s var(--ease) both}
.foot{-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);background:color-mix(in srgb,var(--card) 88%,transparent);box-shadow:0 -8px 24px -18px rgba(23,20,31,.35)}

/* drawer / sidebar */
.ov{-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.drawer{box-shadow:var(--sh3)}
.nav button{position:relative;transition:background .2s,color .2s,transform .25s var(--ease)}
.nav button:hover{background:var(--tint);transform:translateX(3px)}
.nav button.on{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 25%,transparent)}
.nav button.on::before{content:'';position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:3px;background:var(--acc)}
.drawer .nav button{animation:rise .4s var(--ease) both}
.drawer .nav button:nth-child(2){animation-delay:.03s}.drawer .nav button:nth-child(3){animation-delay:.06s}.drawer .nav button:nth-child(4){animation-delay:.09s}
.drawer .nav button:nth-child(5){animation-delay:.12s}.drawer .nav button:nth-child(6){animation-delay:.15s}.drawer .nav button:nth-child(n+7){animation-delay:.18s}
.ava{box-shadow:0 8px 16px -8px var(--c2)}

/* old hero (kept for other uses) */
.hero{position:relative;overflow:hidden;box-shadow:0 24px 40px -22px var(--c2),0 8px 18px -10px rgba(0,0,0,.25)}
.hero::before{content:'';position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),transparent 65%);animation:floaty 8s ease-in-out infinite;pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero h2{text-shadow:0 2px 14px rgba(0,0,0,.25)}

/* ========= COVER HERO (Admin + Student dashboard) ========= */
.chero{position:relative;isolation:isolate;border-radius:24px;overflow:hidden;min-height:270px;color:#fff;display:flex;align-items:flex-end;background:var(--c1);box-shadow:0 30px 50px -26px color-mix(in srgb,var(--c1) 75%,#000),0 12px 24px -14px rgba(0,0,0,.45)}
.chero .cvi{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center;transform:scale(1.04);animation:kenburns 20s ease-in-out infinite alternate}
.chero .cvs{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,8,24,.06) 0%,rgba(10,8,24,.28) 42%,rgba(10,8,24,.82) 100%),linear-gradient(120deg,color-mix(in srgb,var(--c1) 40%,transparent),transparent 62%)}
.chero .cvb{padding:22px 20px 20px;width:100%}
.chero .cvk{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;letter-spacing:.13em;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.38);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 6px 16px -8px rgba(0,0,0,.5)}
.chero h2{font-size:31px;line-height:1.08;font-weight:800;letter-spacing:-.02em;margin:14px 0 8px;text-shadow:0 3px 20px rgba(0,0,0,.55)}
.chero h2 em{font-style:normal;background:linear-gradient(90deg,#fff 0%,#ffe2b8 55%,#ffc0e6 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 10px rgba(0,0,0,.4))}
.chero p{font-size:13.5px;line-height:1.5;opacity:.96;text-shadow:0 1px 10px rgba(0,0,0,.6)}
.cvt{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.cvt div{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:14px;padding:10px 12px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 10px 22px -12px rgba(0,0,0,.55);transition:transform .25s var(--ease),background .25s}
.cvt div:hover{transform:translateY(-3px);background:rgba(255,255,255,.24)}
.cvt b{display:block;font-size:22px;font-weight:800;line-height:1.1;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.cvt span{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.92;font-weight:700}
.cva{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.cvprev{height:120px;border-radius:14px;background-size:cover;background-position:center;border:1px solid var(--line);box-shadow:var(--sh1);margin-bottom:10px}
@media (max-width:420px){.cvt{grid-template-columns:repeat(2,1fr)}.chero h2{font-size:27px}}

/* ========= WEEKLY OVERVIEW (admin) ========= */
.ovr{padding:14px 0;border-top:1px solid var(--line)}.ovr:first-of-type{border-top:0;padding-top:4px}
.ovh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.ovh b{font-size:14px}
.stk{display:flex;height:10px;border-radius:9px;overflow:hidden;background:var(--tint)}.stk i{display:block;height:100%}
.ovn{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;text-align:center}
.ovn div b{display:block;font-size:17px;font-weight:800}.ovn div span{font-size:10.5px;color:var(--mut);font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.skl{height:74px;border-radius:12px;background:linear-gradient(90deg,var(--tint) 25%,color-mix(in srgb,var(--tint) 40%,var(--card)) 50%,var(--tint) 75%);background-size:200% 100%;animation:shimmer 1.3s linear infinite}

/* ========= PASSWORD EYE + VOICE BUTTON ========= */
.pwwrap{position:relative}.pwwrap input{padding-right:48px!important}
.pweye{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--mut);transition:background .2s,color .2s}
.pweye:hover{background:var(--tint);color:var(--ink)}.pweye.on{color:var(--acc)}
.vbtn{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--acc);padding:8px 13px;border-radius:99px;background:color-mix(in srgb,var(--acc) 12%,transparent);transition:background .2s,transform .2s}
.vbtn:hover{background:color-mix(in srgb,var(--acc) 20%,transparent)}.vbtn:active{transform:scale(.96)}
.talking .vbtn svg{animation:pulse .9s ease-in-out infinite}
.vrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}

/* ========= NEW LOGIN ========= */
.login.v4{display:block;padding:0;min-height:100dvh;position:relative;overflow:hidden}
.lbg{position:absolute;inset:0;background:linear-gradient(125deg,var(--c1),var(--c2),var(--c3),var(--c1));background-size:300% 300%;animation:gshift 18s ease infinite}
.lbg i{position:absolute;border-radius:50%;background:rgba(255,255,255,.14);animation:floaty 10s ease-in-out infinite}
.lbg i:nth-child(1){width:320px;height:320px;right:-90px;top:-80px}.lbg i:nth-child(2){width:220px;height:220px;left:-60px;bottom:12%;animation-delay:-3s}.lbg i:nth-child(3){width:130px;height:130px;right:14%;bottom:-40px;animation-delay:-6s}
.lwrap{position:relative;z-index:1;min-height:100dvh;max-width:470px;margin:0 auto;padding:26px 20px;display:flex;flex-direction:column;justify-content:center;gap:20px}
.lside{color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.28);animation:rise .6s var(--ease) both}
.lbrand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px}
.lbrand img,.lbrand .lg{width:50px;height:50px;border-radius:15px;object-fit:cover;box-shadow:0 12px 24px -10px rgba(0,0,0,.5);flex:none}
.lbrand .lg{display:grid;place-items:center;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:15px}
.lside h1{font-size:27px;line-height:1.1;letter-spacing:-.02em;margin:18px 0 4px}
.login.v4 .lside p{font-size:14px;opacity:.95;color:#fff;margin:0}
.lfeat{display:none;margin-top:26px;flex-direction:column;gap:12px}
.lfeat div{display:flex;align-items:center;gap:12px;font-weight:600;font-size:14px}
.lfeat span{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.32);display:grid;place-items:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.login.v4 .lcard{width:100%;max-width:none;padding:26px 22px;border-radius:26px;border:1px solid rgba(255,255,255,.5);background:color-mix(in srgb,var(--card) 94%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 40px 70px -30px rgba(10,8,30,.6);animation:rise .65s var(--ease) .08s both}
.login.v4 .lcard:hover{box-shadow:0 40px 70px -30px rgba(10,8,30,.6)}
.login.v4 .lcard h2{font-size:24px;margin:18px 0 4px;letter-spacing:-.01em}
.login.v4 .lcard p{color:var(--mut);font-size:13.5px;margin-bottom:16px;line-height:1.5}
.login.v4 .lcard p.hint{font-size:12px;margin:-4px 0 12px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--tint);border-radius:15px;padding:4px}
.seg button{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px;border-radius:12px;font-weight:700;font-size:13px;color:var(--mut);transition:background .25s,color .25s,box-shadow .25s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh2)}
.lform{animation:rise .45s var(--ease) both}
.lcard .btn.big{padding:14px;font-size:14.5px;border-radius:14px}
@media (min-width:900px){
  .lwrap{max-width:1020px;flex-direction:row;align-items:center;gap:64px;padding:40px}
  .lside{flex:1}.lside h1{font-size:44px;margin-top:28px}.login.v4 .lside p{font-size:16px}.lfeat{display:flex}
  .login.v4 .lcard{flex:0 0 420px;width:420px}
}

/* ========= WELCOME AFTER LOGIN ========= */
.wlc{overflow:auto;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.wlc .wbox{position:relative;max-width:410px;padding:0 0 20px;overflow:hidden;box-shadow:0 40px 80px -30px rgba(0,0,0,.65);max-height:94dvh;overflow-y:auto}
.whead{height:150px;position:relative;display:grid;place-items:start center;margin-bottom:46px;background:linear-gradient(135deg,var(--c1),var(--c2) 55%,var(--c3));background-size:200% 200%;animation:gshift 9s ease infinite}
.whead::before{content:'';position:absolute;right:-40px;top:-60px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.18);animation:floaty 7s ease-in-out infinite}
.wlc .whead img,.wlc .whead .lg{width:72px;height:72px;margin:0;border-radius:20px;border:3px solid rgba(255,255,255,.75);box-shadow:0 14px 28px -10px rgba(0,0,0,.5);font-size:22px;position:relative;margin-top:22px}
.wcheck{position:absolute;bottom:-34px;left:50%;transform:translateX(-50%);width:70px;height:70px;background:var(--card);border-radius:50%;box-shadow:0 12px 26px -10px rgba(0,0,0,.45);padding:7px}
.wcheck circle{fill:none;stroke:var(--ok);stroke-width:3;stroke-dasharray:151;stroke-dashoffset:151;animation:dash .7s .35s ease forwards}
.wcheck path{fill:none;stroke:var(--ok);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:dash .45s .95s ease forwards}
.wsalam{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:800;margin-top:6px}
.wlc .wbox h2{font-size:27px;letter-spacing:-.015em;margin:4px 16px 6px;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.15}
.wlc .wcong{padding:0 20px;color:var(--ink);font-weight:700;font-size:14px;margin-bottom:14px}
.wtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 18px;margin-bottom:12px}
.wtiles div{background:var(--tint);border-radius:14px;padding:12px 4px;animation:rise .5s var(--ease) both}
.wtiles div:nth-child(2){animation-delay:.08s}.wtiles div:nth-child(3){animation-delay:.16s}
.wtiles b{display:block;font-size:26px;font-weight:800;line-height:1.1}.wtiles span{font-size:10.5px;color:var(--mut);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.wlist{padding:0 18px;text-align:left;display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.wrow{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:13px;background:var(--card);animation:rise .45s var(--ease) both}
.wrow:nth-child(2){animation-delay:.07s}.wrow:nth-child(3){animation-delay:.14s}.wrow:nth-child(4){animation-delay:.21s}.wrow:nth-child(5){animation-delay:.28s}
.wrow small{color:var(--mut);font-size:12px}
.wload{display:flex;gap:6px;justify-content:center;padding:18px}.wload i{width:9px;height:9px;border-radius:50%;background:var(--acc);animation:dots 1.1s infinite}.wload i:nth-child(2){animation-delay:.15s}.wload i:nth-child(3){animation-delay:.3s}
.wlc .wgo{width:calc(100% - 36px);margin:0 18px 10px;justify-content:center;padding:13px}
.cfw{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2}
.cf{position:absolute;top:-24px;border-radius:2px;opacity:0;animation:fall linear forwards}

/* ========= LAYOUT: tablet + desktop ========= */
@media (min-width:600px){.app{max-width:720px}.foot{max-width:720px}}
@media (min-width:700px){
  main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-content:start}
  main>*{grid-column:1/-1}main>.card.stat{grid-column:auto}
}
@media (min-width:1024px){
  .app.wide{max-width:none;margin:0 0 0 292px}
  .app.wide main{width:100%;max-width:900px;margin:0 auto;padding:30px 30px 92px}
  .app.wide .top{padding:14px 30px}.app.wide .top [data-a="drawer"]{display:none}.app.wide .top h1{margin-left:2px;font-size:19px}
  .app.wide .foot{left:292px;right:0;width:auto;max-width:none;transform:none}
  .ov.wide{inset:0 auto 0 0;width:292px;background:none;pointer-events:none;-webkit-backdrop-filter:none;backdrop-filter:none;z-index:30}
  .ov.wide .drawer{pointer-events:auto;width:292px;max-width:none;animation:none;box-shadow:6px 0 30px -18px rgba(23,20,31,.35);border-right:1px solid var(--line)}
  .ov.wide .dh .ib{display:none}
}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}

const I=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICON[n]||''}"/></svg>`;

const API_BASE='';
const OWNED=['assigned','courses','folders','papers','notes','messages','questions'];
const GLOBAL=['brand','profile','menu','subjects','chapters','board'];
const clone=o=>o===undefined?o:JSON.parse(JSON.stringify(o));
const uid=()=>'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const newDB=()=>{const x=seed(),sh={};GLOBAL.concat(OWNED).forEach(k=>sh[k]=x[k]);sh.posts=x.posts;return{v:1,accounts:[],shared:sh,progress:{},session:null}};

async function hydrate(){try{const d=await api('/api/state');DB=d;onlineReady=true;return true}catch(e){onlineReady=false;return false}}
function saveDB(){ if(!onlineReady)return; clearTimeout(saveTimer); saveTimer=setTimeout(async()=>{try{const a=me();if(!a)return;if(a.role==='admin')await api('/api/admin/shared',{method:'PUT',body:JSON.stringify({data:DB.shared})});else await api('/api/progress',{method:'PUT',body:JSON.stringify({data:DB.progress[a.id]||{}})});}catch(e){console.warn(e)}},350); }
async function saveNow(){clearTimeout(saveTimer);if(!onlineReady)return;const a=me();if(!a)return;if(a.role==='admin')await api('/api/admin/shared',{method:'PUT',body:JSON.stringify({data:DB.shared})});else await api('/api/progress',{method:'PUT',body:JSON.stringify({data:DB.progress[a.id]||{}})});}
const me=()=>DB.accounts.find(a=>a.id===DB.session)||null;
const role=()=>me()?.role||'';

/* Student ko ye item dikhna chahiye ya nahi (class/student assign) */
function visibleTo(i,acc){
  const to=i.to||'all';
  if(to.startsWith('grade:'))return acc.grade===to.slice(6);
  if(to.startsWith('stu:'))return to.slice(4)===acc.id;
  return true;
}
function toOptions(){
  const o=[['all','All students']];
  GRADES.forEach(g=>o.push(['grade:'+g,g+' (whole class)']));
  DB.accounts.filter(a=>a.role==='student').forEach(a=>o.push(['stu:'+a.id,a.name+(a.grade?' ('+a.grade+')':'')]));
  return o;
}
function hintAssigned(row){
  const have=S.questions.filter(q=>q.subject===row.subject&&q.q).length,need=+row.count||0;
  return `<p class="hint" style="margin:0">The bank has ${have} MCQs in ${esc(row.subject)}. ${need>have?'Add '+(need-have)+' more MCQs, or lower the number above.':'Students get '+need+' random MCQs from them.'}</p>`;
}
const firstTab=()=>'accounts';
function chkAcc(n,u,p){
  if(!n)return 'Enter a name';
  if(!/^[a-z0-9_.-]{3,20}$/.test(u))return 'Username: 3-20 letters, numbers, dot, dash or underscore';
  if(DB.accounts.some(a=>a.username===u))return 'That username is already taken';
  if(!/^(?=.{10,128}$)(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[^A-Za-z0-9]).*$/.test(p))return 'Password must be 10+ characters with uppercase, lowercase, number and symbol';
  return '';
}
/* Login karne walay ke hisaab se S (screen ka data) banata hai */
function buildS(acc){
  const sh=DB.shared,x=seed();
  GLOBAL.forEach(k=>{if(sh[k]!==undefined)x[k]=clone(sh[k])});
  if(!x.profile)x.profile=seed().profile;
  x.posts=clone(sh.posts||[]);
  OWNED.forEach(k=>{
    let l=sh[k]||[];
    if(acc.role==='student'&&k!=='questions')l=l.filter(i=>visibleTo(i,acc));
    x[k]=clone(l);
  });
  if(!x.menu.some(m=>m.id==='weekly'))x.menu.push({id:'weekly',label:'Weekly Test',icon:'bolt',on:true});
  if(!x.menu.some(m=>m.id==='help'))x.menu.push({id:'help',label:'Help Center',icon:'help',on:true});
  const pr=DB.progress[acc.id]||{};
  x.user=Object.assign(x.user,pr.user||{},{name:acc.name,email:({admin:'Admin',student:'Student'})[acc.role]+' - @'+acc.username+(acc.grade?' - '+acc.grade:'')});
  x.tests=clone(pr.tests||[]);x.community=pr.community||{replies:0,helpful:0};
  x.route=acc.role==='student'?'dashboard':'home';
  return x;
}
/* Screen ka data wapas database mein save karta hai (role ke hisaab se) */
function persist(){
  const a=me();if(!a)return;
  const sh=DB.shared;
  if(a.role==='admin'){GLOBAL.concat(OWNED).forEach(k=>sh[k]=clone(S[k]))}
  else{DB.progress[a.id]={user:clone(S.user),tests:clone(S.tests),community:clone(S.community)};sh.posts=clone(S.posts)}
  saveDB();
}
async function doLogin(adminOnly){
  const u=$('#lu').value.trim().toLowerCase(),p=$('#lp').value.trim();
  if(!u||!p){toast('Please type your username and password');say('Please type your username and your password.');return}
  const btn=document.querySelector('[data-a=login],[data-a=alogin]');if(btn)btn.classList.add('busy');
  try{const d=await api('/api/login',{method:'POST',body:JSON.stringify({username:u,password:p,adminOnly})});DB=d;onlineReady=true;wkReset();OV.data=null;OV.at=0;run=null;nav.length=0;ui.lbd=null;ui.lbAt=0;ui.cs=null;ui.csel=[];ui.cf=null;const a=me();S=buildS(a);ui.ss=null;ui.panel=false;ui.drawer=false;ui.tab=firstTab();ui.col='courses';apply();renderPanel();render();showLoginWelcome();}
  catch(e){if(btn)btn.classList.remove('busy');toast(e.message);say('Login failed. Please check your username and password, and try again.')}
}
function signIn(a){DB.session=a.id;run=null;nav.length=0;S=buildS(a);ui.panel=false;ui.drawer=false;ui.tab=firstTab();ui.col='courses';apply();renderPanel();render();}

function accOp(fn){
  persist();fn();saveDB();
  const r=S.route;S=buildS(me());S.route=r;
  renderPanel();render();
}

const done=()=>S.tests.filter(t=>t.status!=='In Progress');
const stats=()=>{const d=done();const c=d.reduce((a,t)=>a+t.correct,0),n=d.reduce((a,t)=>a+t.total,0);
  return{completed:d.length,progress:S.tests.length-d.length,solved:n,correct:c,wrong:n-c,acc:n?Math.round(c/n*1000)/10:0,avg:d.length?Math.round(d.reduce((a,t)=>a+t.correct/t.total*100,0)/d.length):0}};
/* Leaderboard = real students (from server) + any entries the Admin added. Your own row always uses your latest local points. */
function lbList(){
  const a=me(),st=stats();
  return [{id:a&&a.id,name:S.user.name||'You',score:S.user.points,acc:st.acc,solved:st.solved,me:true}];
}

}
const rank=()=>(ui.lbd&&ui.lbd.rank)||1;
const total=()=>(ui.lbd&&ui.lbd.total)||1;
const topPct=()=>Math.round(rank()/total()*1000)/10;

const rcol=p=>p>=75?'var(--ok)':p>=60?'var(--acc)':'var(--bad)';

function toast(m,ms=2200){const t=$('#tst');t.innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>t.innerHTML='',ms)}

const nav=[];let hOK=true;

function goBack(){
  if(ui.panel){ui.panel=false;renderPanel();histPush();return}

}

function testRow(t,solo){
  const p=t.status==='In Progress'?Math.round(t.correct/t.total*100):Math.round(t.correct/t.total*100);
  const pill=t.status==='Passed'?'<span class="pill ok">Pass</span>':t.status==='Failed'?'<span class="pill bad">Fail</span>':'<span class="pill warn">In Progress</span>';
  return `<div class="trow">${ring(p)}<div style="flex:1;min-width:0"><div class="tags"><h4>${esc(t.title)}</h4>${pill}</div>
    <p>${t.status==='In Progress'?`${t.correct}/${t.total} answered`:`${t.correct}/${t.total} correct`} &middot; ${esc(t.bank)}</p>
    <div class="tags"><span class="pill pu">${esc(t.subject)}</span><span class="pill">${esc(t.date)}</span></div>
    <div class="acts"><button class="btn line sm" data-a="review" data-id="${esc(t.id)}">${I('chart',14)} Results</button>
    <button class="btn line sm" data-a="review" data-id="${esc(t.id)}">${I('eye',14)} Review</button>
    <button class="btn sm" data-a="retake" data-id="${esc(t.id)}">Retake</button></div></div></div>`;
}

/* Course progress is automatic: completed tests of the course subject (and chapter, if set). */
function courseDone(c){
  const n=done().filter(t=>(!c.subject||t.subject===c.subject)&&(!c.chapter||(Array.isArray(t.chapters)&&t.chapters.includes(c.chapter)))).length;
  return Math.min(n,c.tests||0);
}
function pgCourses(){
  return S.courses.length?S.courses.map(c=>{c=Object.assign({},c,{done:courseDone(c)});const p=c.tests?Math.round(c.done/c.tests*100):0;
    const btn=p>=100?'Review':p>0?'Continue':'Start';
    return `<div class="card"><div class="cover"><em>${esc(c.tag)}</em>${esc(c.title)}</div>
    <h3 style="font-size:17px">${esc(c.title)}</h3><div class="person"><span class="av">${esc(initials(c.teacher))}</span>${esc(c.teacher)}</div>
    <div style="font-size:12px;color:var(--mut);margin-bottom:10px">${esc(c.dates)}${c.dates?' &middot; ':''}${c.subject?esc(c.subject)+(c.chapter?' &rsaquo; '+esc(c.chapter):'')+' &middot; ':''}${c.tests} tests</div>
    <div class="kv" style="margin-top:0"><span>Progress</span><b>${p}% (${c.done}/${c.tests})</b></div><div class="bar"><i style="width:${p}%"></i></div>
    <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn sm" data-a="startCourse" data-i="${S.courses.findIndex(x=>x.title===c.title&&x.tag===c.tag)}">${btn}</button></div></div>`}).join('')
    :`<div class="card empty"><b>No courses yet</b>${isStaff()?'Add courses from the panel &gt; Content.':'Admin has not added courses yet.'}</div>`;
}

const availOf=sub=>S.questions.filter(q=>q.subject===sub&&q.q).length;
const fmtT=ms=>{const t=Math.max(0,Math.round(ms/1000));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
const chaptersOf=sub=>(S.chapters&&S.chapters[sub])||[];

const availSel=(sub,names)=>names&&names.length?S.questions.filter(q=>q.subject===sub&&q.q&&names.includes(q.chapter)).length:availOf(sub);

function pgCreate(){

function pgRun(){

    const t=run.t,p=Math.round(t.correct/t.total*100);
    return `<div class="card" style="text-align:center"><div style="display:flex;justify-content:center;margin-bottom:12px"><div class="ring" style="--p:${p};--col:${rcol(p)};width:96px;height:96px"><span style="width:76px;height:76px;font-size:22px">${p}%</span></div></div>

/* ============ VOICE (login guide + welcome) ============ */
const voiceOn=()=>{try{return localStorage.getItem('pv_mute')!=='1'}catch(e){return true}};
function pickVoice(){try{const v=speechSynthesis.getVoices();return v.find(x=>/^en[-_]IN/i.test(x.lang))||v.find(x=>/^en[-_]GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){return null}}
function say(text,o={}){
  try{
    if(!('speechSynthesis' in window)||(!o.force&&!voiceOn()))return false;
    if(!o.queue)speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang='en-IN';u.rate=.95;u.pitch=1;
    const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}
    const el=document.documentElement;
    u.onstart=()=>el.classList.add('talking');u.onend=()=>el.classList.remove('talking');
    u.onerror=e=>{el.classList.remove('talking');if(e.error==='not-allowed'&&o.onfail)o.onfail()};
    setTimeout(()=>speechSynthesis.speak(u),o.queue?0:150);
    return true;
  }catch(e){return false}
}

function wkCounts(ps){
  const total=ps.length,att=ps.filter(p=>p.state==='submitted').length,
    rem=ps.filter(p=>p.state==='none'||p.state==='in_progress').length,
    missed=ps.filter(p=>p.state==='closed').length,
    res=ps.filter(p=>p.state==='submitted'&&p.result&&!p.result.hidden&&!p.pending),
    pass=res.filter(p=>p.result.passed).length,
    wait=ps.filter(p=>p.state==='submitted'&&(p.pending||(p.result&&p.result.hidden))).length;
  return{total,att,rem,missed,res,pass,fail:res.length-pass,wait};
}

  if(OV.loading&&OV.p)return OV.p;
  if(!force&&OV.at&&Date.now()-OV.at<30000)return Promise.resolve(OV.data);

function resizeCover(file){
  return new Promise((res,rej)=>{
    if(!/^image\/(png|jpe?g|webp)$/.test(file.type))return rej(new Error('Please choose a PNG, JPG or WEBP photo'));
    if(file.size>12*1024*1024)return rej(new Error('Photo is too big. Choose one under 12 MB'));
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const W=1200,H=525,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
      const k=Math.max(W/img.width,H/img.height),sw=W/k,sh=H/k;
      x.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,0,0,W,H);
      for(const q of [.82,.7,.58,.46]){const u=c.toDataURL('image/jpeg',q);if(u.length<=800000)return res(u)}

    };

let _ac=null;
function playChime(){
  try{
    _ac=_ac||new (window.AudioContext||window.webkitAudioContext)();const c=_ac,t0=c.currentTime;
    [[523.25,0],[659.25,.16],[783.99,.32],[1046.5,.5]].forEach(([fr,dt])=>{
      const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=fr;
      g.gain.setValueAtTime(0.0001,t0+dt);g.gain.exponentialRampToValueAtTime(.28,t0+dt+.03);g.gain.exponentialRampToValueAtTime(.0001,t0+dt+.55);
      o.connect(g);g.connect(c.destination);o.start(t0+dt);o.stop(t0+dt+.6);
    });
  }catch(e){}
}

function resizeLogo(file){
  return new Promise((res,rej)=>{
    if(!/^image\//.test(file.type))return rej(new Error('Please choose an image file'));
    if(file.size>6*1024*1024)return rej(new Error('Image is too big. Choose one under 6 MB'));
    if(file.type==='image/svg+xml'){const r=new FileReader();r.onload=()=>{r.result.length>300000?rej(new Error('SVG is too large')):res(r.result)};r.onerror=()=>rej(new Error('Could not read the image'));r.readAsDataURL(file);return}
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const type=file.type==='image/jpeg'?'image/jpeg':'image/png';
      for(const m of [256,192,128,96]){
        const k=Math.min(1,m/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*k)),h=Math.max(1,Math.round(img.height*k));
        const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
        const u=c.toDataURL(type,.85);if(u.length<=150000)return res(u);
      }
      rej(new Error('This logo is too detailed. Please choose a simpler or smaller image.'));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Could not read the image'))};img.src=url;
  });
}

const fld=(l,attrs,v,t='text')=>`<label class="f"><span>${l}</span><input type="${t}" ${attrs} value="${esc(v)}"></label>`;
function splitLine(line){
  if(line.includes('|'))return line.split('|');
  if(line.includes('\t'))return line.split('\t');
  const out=[];let cur='',q=false;
  for(const ch of line){if(ch==='"')q=!q;else if(ch===','&&!q){out.push(cur);cur=''}else cur+=ch}
  out.push(cur);return out;
}
function importMCQs(text,defSub,defCh){
  let ok=0,bad=0,nochap=0;
  const matchCh=(sub,c)=>{c=String(c||'').trim().toLowerCase();if(!c)return '';const m=chaptersOf(sub).find(x=>x.n.toLowerCase()===c);return m?m.n:null};
  String(text).split(/\r?\n/).forEach(line=>{
    line=line.trim();if(!line)return;
    let p=splitLine(line).map(x=>x.trim()),sub,ch,q,a,b,c,d,r;
    if(p.length===6){sub=defSub;ch=defCh||'';[q,a,b,c,d,r]=p}
    else if(p.length===7){[sub,q,a,b,c,d,r]=p;ch=sub===defSub?(defCh||''):''}
    else if(p.length>=8){[sub,ch,q,a,b,c,d,r]=p}
    else{bad++;return}
    const k=String(r).trim().toUpperCase(),n='ABCD'.indexOf(k)+1||parseInt(k);
    if(!sub||!q||!a||!b||!c||!d||!(n>=1&&n<=4)){bad++;return}
    if(!S.subjects.includes(sub))S.subjects.push(sub);
    const m=matchCh(sub,ch);if(m===null)nochap++;
    S.questions.push({subject:sub,chapter:m||'',q,o1:a,o2:b,o3:c,o4:d,ans:n});ok++;
  });
  return{ok,bad,nochap};
}
async function uploadNoteFiles(i,files){
  const note=S.notes[i];if(!note)return;
  ui.nfBusy=i;render();let ok=0;
  for(const f of files){
    if(f.size>15*1024*1024){toast(f.name+': file is larger than 15 MB',4000);continue}
    try{
      const r=await fetch(API_BASE+'/api/admin/note-files',{method:'POST',credentials:'include',headers:{'Content-Type':'application/octet-stream','X-File-Name':encodeURIComponent(f.name)},body:f});
      const d=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(d.error||'Upload failed');
      (note.files=note.files||[]).push(d.file);ok++;
    }catch(e){toast(f.name+': '+e.message,5000)}
  }
  ui.nfBusy=null;if(ok){persist();toast(ok+' file'+(ok>1?'s':'')+' attached')}
  render();
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startRun(subject,n,bank,minutes,cap,chapters){
  chapters=Array.isArray(chapters)?chapters:[];
  const pool=shuffle(S.questions.filter(q=>q.subject===subject&&q.q&&(!chapters.length||chapters.includes(q.chapter))));
  if(!pool.length){toast('No MCQs for '+subject+'. '+(isStaff()?'Add some in the panel > Content > Question bank.':'Ask your admin to add some.'));return}
  if(n>pool.length){
    if(!cap){toast('Only '+pool.length+' MCQs in '+subject+', but '+n+' needed. '+(isStaff()?'Add more in the panel > Content > Question bank > Import MCQs.':'Ask your admin to add more.'));return}
    toast('Bank has only '+pool.length+' MCQs for '+subject+'. Starting with '+pool.length+'.');n=pool.length;
  }
  run={subject,bank,chapters,qs:pool.slice(0,Math.max(1,n)),i:0,ans:[],view:'take',end:minutes>0?Date.now()+minutes*60000:0};
  go('run');
}
function finishRun(){
  S.route='run';
  const correct=run.qs.reduce((a,q,i)=>a+(run.ans[i]===q.ans?1:0),0),n=run.qs.length;
  const nums=S.tests.map(t=>parseInt(String(t.id).replace(/\D/g,''))||0);
  const id='Test'+(Math.max(10000,...nums)+1);
  const t={id,title:id,subject:run.subject,bank:run.bank,chapters:run.chapters||[],total:n,correct,date:fmtDate(new Date()),status:correct/n>=.5?'Passed':'Failed',qs:run.qs,ans:run.ans.slice()};
  S.tests.unshift(t);S.user.points+=correct;run.t=t;run.view='result';
  /* save to the database so the score counts on the leaderboard */
  if(!isStaff()){persist();saveNow().then(()=>lbRefresh(true)).catch(()=>{})}
  render();
}

const QIMG_LABELS={qi:'Question picture / diagram',i1:'Option A picture',i2:'Option B picture',i3:'Option C picture',i4:'Option D picture'};
const IMGF={q:'qi',o1:'i1',o2:'i2',o3:'i3',o4:'i4'};
const qimgSrc=id=>API_BASE+'/api/q-images/'+encodeURIComponent(id);
function qimg(id,zoom){return id?`<img class="qimg" src="${qimgSrc(id)}" alt="Diagram" loading="lazy" ${zoom?`data-a="zoomimg" data-id="${esc(id)}" style="cursor:zoom-in"`:''}>`:''}
function optHTML(q,n){return `<span class="ot">${q['o'+n]?esc(q['o'+n]):''}${qimg(q['i'+n])}</span>`}
function qimgPrepare(file){return new Promise((ok,no)=>{
  if(!/^image\/(png|jpe?g|webp|gif)$/i.test(file.type)){no(new Error('Please choose a JPG, PNG, WEBP or GIF picture'));return}
  const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{URL.revokeObjectURL(u);let w=im.naturalWidth,h=im.naturalHeight;if(!w||!h){no(new Error('Could not read this picture'));return}
    const sc=Math.min(1,1600/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
    c.toBlob(b=>b?ok(b):no(new Error('Could not process this picture')),'image/jpeg',.9)};
  im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('Could not read this picture'))};im.src=u})}
async function qimgUpload(file){
  const blob=await qimgPrepare(file);
  if(blob.size>5*1024*1024)throw new Error('Picture is too large. Try a smaller one.');
  const r=await fetch(API_BASE+'/api/admin/q-images',{method:'POST',credentials:'include',headers:{'Content-Type':'application/octet-stream'},body:blob});
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Upload failed');return d.id}

function imgField(scope,idx,f,row,lock){
  const id=row[f]||'';if(lock&&!id)return '';
  return imgCtl(scope+'|'+idx+'|'+f,id,lock)}
function qaImgInner(f){return imgCtl('qa|0|'+f,(ui.qaImg||{})[f]||'',false)}
async function qimgPick(k,file){

const wkToLabel=to=>{to=to||'all';if(to==='all')return 'All students';if(to.startsWith('grade:'))return to.slice(6)+' (whole class)';if(to.startsWith('stu:')){const a=DB.accounts.find(x=>x.id===to.slice(4));return a?a.name:'One student'}return to};

function wkParse(text){
  const out=[];let bad=0;
  String(text||'').split(/\r?\n/).forEach(l=>{
    l=l.trim();if(!l)return;
    const p=l.split('|').map(s=>s.trim());
    if(p.length<6){bad++;return}
    const a=p[5].toUpperCase(),n='ABCD'.indexOf(a)>=0&&a.length===1?'ABCD'.indexOf(a)+1:parseInt(a);
    if(!p[0]||p.slice(1,5).some(x=>!x)||![1,2,3,4].includes(n)){bad++;return}
    out.push({q:p[0],o1:p[1],o2:p[2],o3:p[3],o4:p[4],ans:n});
  });
  return{out,bad};
}

  return `<p class="hint">The weekly test is separate from practice. You can take each weekly test only once.</p>`+wkSummary()+top+WKS.papers.map(p=>{
    const meta=`${wkKindPill(p.kind)} ${esc(p.subject||'Weekly test')} &middot; ${p.questionCount} questions &middot; ${p.minutes?p.minutes+' min':'No time limit'} &middot; ${p.totalMarks} marks`;
    let body='';
    if(p.state==='submitted'&&p.result&&p.result.hidden)body=`<div class="acts" style="margin-top:8px"><span class="pill warn">Submitted. Result will show after your teacher publishes it</span></div>`;
    else if(p.state==='submitted'&&p.pending)body=`<div class="acts" style="margin-top:8px"><span class="pill warn">Submitted. Waiting for your teacher to check</span></div>`;
    else if(p.state==='submitted'){const r=p.result;body=`<div class="kv" style="margin:8px 0"><span>Your score</span><b>${r.score}/${r.totalMarks} (${r.percent}%)</b></div><div class="acts">${r.passed?'<span class="pill ok">Pass</span>':'<span class="pill bad">Fail</span>'}${p.canReview?`<button class="btn line sm" data-a="wkresult" data-id="${esc(p.id)}">${p.kind==='subjective'?'View marks and feedback':'View answers'}</button>`:''}</div>`}
    else if(p.state==='in_progress')body=`<div class="acts" style="margin-top:8px"><span class="pill warn">In progress</span><button class="btn" data-a="wkstart" data-id="${esc(p.id)}">Resume test</button></div>`;
    else if(p.state==='closed')body=`<div class="acts" style="margin-top:8px"><span class="pill">Closed</span></div>`;
    else body=`<div class="acts" style="margin-top:8px"><button class="btn" data-a="wkstart" data-id="${esc(p.id)}">${I('bolt',16)} Start test</button></div>`;
    return `<div class="card"><b style="font-size:15px">${esc(p.title)}</b><p class="hint" style="margin:4px 0 0">${meta}</p>${body}</div>`;
  }).join('');
}

/* Weekly summary (alag hai: practice, Test History aur Leaderboard mein shamil nahi) */
function wkSummary(){
  const all=WKS.papers.filter(p=>p.state==='submitted'&&p.result&&!p.result.hidden);
  if(!all.length)return '';
  const d=all.filter(p=>!p.pending),pend=all.length-d.length;
  const waiting=pend?`<p class="hint" style="margin:8px 0 0">${pend} test${pend>1?'s are':' is'} waiting for your teacher to check. ${d.length?'':'Your summary will appear after checking.'}</p>`:'';
  if(!d.length)return `<div class="card"><div class="sec"><h3>My weekly summary</h3></div>${waiting}</div>`;
  const c=+d.reduce((a,p)=>a+p.result.score,0).toFixed(2),n=+d.reduce((a,p)=>a+p.result.totalMarks,0).toFixed(2);
  const acc=n?Math.round(c/n*1000)/10:0;
  const avg=Math.round(d.reduce((a,p)=>a+p.result.percent,0)/d.length*10)/10;
  const best=d.reduce((m,p)=>p.result.percent>m.result.percent?p:m,d[0]);
  const passed=d.filter(p=>p.result.passed).length;
  const by={};
  d.forEach(p=>{const k=(p.subject||'').trim()||'General';const o=by[k]||(by[k]={sub:k,c:0,n:0,t:0});o.c+=p.result.score;o.n+=p.result.totalMarks;o.t++});
  const subs=Object.values(by).map(o=>({...o,p:o.n?Math.round(o.c/o.n*100):0})).sort((a,b)=>b.p-a.p);
  return `<div class="card"><div class="sec"><h3>My weekly summary</h3><span class="pill pu">${passed}/${d.length} passed</span></div>
  <div class="grid2">
  <div class="card stat" style="background:var(--tint)"><span>Tests taken</span><b>${all.length}</b></div>
  <div class="card stat" style="background:var(--tint)"><span>Overall accuracy</span><b>${acc}%</b><small>${c} of ${n} marks</small></div>
  <div class="card stat" style="background:var(--tint)"><span>Average score</span><b>${avg}%</b><small>per test</small></div>
  <div class="card stat" style="background:var(--tint)"><span>Best score</span><b>${best.result.percent}%</b><small>${esc(best.title)}</small></div></div>
  <div class="kv"><span>Overall weekly accuracy</span><b>${acc}%</b></div><div class="bar"><i style="width:${acc}%;background:${rcol(acc)}"></i></div>
  <div class="hh" style="margin-top:16px">Subject-wise accuracy</div>
  ${subs.map(o=>`<div class="kv" style="margin-top:0"><span>${esc(o.sub)} &middot; ${o.t} test${o.t>1?'s':''}</span><b>${o.p}%</b></div><div class="bar" style="margin-bottom:10px"><i style="width:${o.p}%;background:${rcol(o.p)}"></i></div>`).join('')}
  ${waiting}<p class="hint" style="margin:6px 0 0">Ye hisaab sirf weekly tests ka hai (checked tests ke marks ke hisab se). Practice, Test History aur Leaderboard mein shamil nahi.</p></div>`;
}

  :[1,2,3,4].map(n=>`<button class="opt ${sel===n?'sel':''}" data-a="wkpick" data-v="${n}"><i>${'ABCD'[n-1]}</i>${optHTML(q,n)}</button>`).join('')}

async function wkFinish(auto){

  const subjR=wkrun.kind==='subjective';
  if(!auto){const un=wkrun.qs.filter((q,i)=>!(subjR?String(wkrun.ans[i]||'').trim():wkrun.ans[i])).length;if(!confirm((un?'You have '+un+' unanswered question(s). ':'')+'Submit the test now? You cannot retake it.'))return}
  wkrun.busy=true;
  try{const ans=wkrun.qs.map((q,i)=>wkrun.ans[i]||(subjR?'':0));const d=await api('/api/weekly/'+encodeURIComponent(wkrun.id)+'/submit',{method:'POST',body:JSON.stringify({answers:ans})});wkrun.result=d;wkrun.view='result';WKS.loaded=false;S.route='wkrun';window.scrollTo(0,0);render()}
  catch(e){wkrun.busy=false;wkrun.retryAt=Date.now()+5000;toast(e.message)}
}

  if(t.dataset.wka!==undefined&&wkrun&&wkrun.view==='take'){wkrun.ans[wkrun.i]=t.value;clearTimeout(wkSaveT);const id=wkrun.id;wkSaveT=setTimeout(()=>{if(!wkrun||wkrun.id!==id||wkrun.view!=='take')return;api('/api/weekly/'+encodeURIComponent(id)+'/save',{method:'POST',body:JSON.stringify({answers:wkrun.qs.map((q,i)=>wkrun.ans[i]||'')})}).catch(()=>{})},1500);return}
  if(t.dataset.wkg!==undefined&&WK.grade){const k=t.dataset.wkg;if(k==='feedback')WK.grade.feedback=t.value;else{const[i,f]=k.split('|'),q=WK.grade.questions[+i];if(q){if(f==='m')q.awarded=t.value===''?'':+t.value;else q.comment=t.value;const el=$('#wkgtot');if(el)el.textContent=wkGradeTotal()}}return}
  if(t.dataset.wk&&WK.edit){WK.edit[t.dataset.wk]=t.type==='checkbox'?t.checked:t.type==='number'?(t.value===''?'':+t.value):t.value;return}
  if(t.dataset.wkq&&WK.edit){const[i,f]=t.dataset.wkq.split('|'),q=WK.edit.questions[+i];if(q)q[f]=f==='ans'?+t.value:f==='marks'?(t.value===''?'':+t.value):t.value;return}
},true);
setInterval(()=>{
  if(!wkrun||wkrun.view!=='take'||!wkrun.end)return;
  const left=wkrun.end-Date.now(),el=$('#wktmr');if(el)el.textContent=fmtT(left);
  if(left<=0&&!wkrun.busy&&Date.now()>=(wkrun.retryAt||0)){toast('Time is up. Submitting your test');wkFinish(true)}
},1000);

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.disabled)return;if(t.classList.contains('ov')&&e.target!==t)return;A[t.dataset.a]?.(t.dataset,e)});

function setPath(p,v){const k=p.split('.');let o=S;while(k.length>1)o=o[k.shift()];o[k[0]]=v}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.qimgUp!==undefined&&t.files&&t.files[0]){const f=t.files[0],k=t.dataset.qimgUp;t.value='';qimgPick(k,f);return}
  if(t.dataset.nf!==undefined&&t.files&&t.files.length){const fl=[...t.files];t.value='';uploadNoteFiles(+t.dataset.nf,fl);return}
  if(t.id==='sscover'&&t.files[0]){resizeCover(t.files[0]).then(u=>{ssInit();ui.ss.cover=u;render();toast('Cover photo added. Tap Save and apply')}).catch(er=>toast(er.message));return}
  if(t.id==='sslogo'&&t.files[0]){resizeLogo(t.files[0]).then(u=>{ssInit();ui.ss.logo=u;render();toast('Logo added. Tap Save and apply')}).catch(er=>toast(er.message));return}
  if(t.dataset.acct){const a=DB.accounts.find(x=>x.id===t.dataset.acct);if(a){a.grade=t.value;api('/api/admin/accounts/'+encodeURIComponent(a.id),{method:'PATCH',body:JSON.stringify({grade:t.value})}).catch(e=>toast(e.message));}return}
  if(t.id==='qfile'&&t.files[0]){const f=t.files[0],r=new FileReader();r.onload=()=>{const x=importMCQs(r.result,$('#bsub').value,$('#bch')?$('#bch').value:'');toast(x.ok+' MCQs imported'+(x.bad?', '+x.bad+' lines skipped':'')+(x.nochap?', '+x.nochap+' without a matching chapter':''));renderPanel();render()};r.readAsText(f)}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='hlpq'){const q=t.value.trim().toLowerCase();let n=0;document.querySelectorAll('#hlist .hq').forEach(d=>{const ok=!q||d.dataset.q.includes(q);d.style.display=ok?'':'none';if(q&&ok)d.open=false;if(ok)n++});$('#hnone').style.display=n?'none':'';return}
  if(t.id==='cs'){cfSave();ui.cs=t.value;ui.csel=[];render();return}
  if(t.id==='cn'||t.id==='ct'||t.id==='cb'){cfSave();return}
  if(t.id==='qa_sub'){ui.qsub=t.value;const c=$('#qa_ch');if(c)c.innerHTML=chapOptions(t.value,'');return}
  if(t.id==='bsub'){const c=$('#bch');if(c)c.innerHTML=chapOptions(t.value,'');return}
  if(t.id==='qfch'){ui.qfc=t.value;ui.qlim=15;renderPanel();return}
  if(t.dataset.chi!==undefined){const c=(S.chapters[ui.qf]||[])[+t.dataset.chi];if(c){if(t.dataset.chf==='y')c.y=+t.value;else{const old=c.n;c.n=t.value;S.questions.forEach(q=>{if(q.subject===ui.qf&&q.chapter===old)q.chapter=t.value})}persist()}return}
  if(t.id==='qfsel'){ui.qf=t.value;ui.qfc='All';ui.qlim=15;renderPanel();return}
  if(t.id==='hq'){ui.hq=t.value;ui.hp=1;ui.keepHq=true;render();return}
  if(t.id==='vq'){ui.vq=t.value;ui.keepVq=true;render();return}
  const v=t.type==='checkbox'?t.checked:t.type==='number'?(t.value===''?0:+t.value):t.value;
  if(t.dataset.bind){
    if(t.dataset.bind==='subjects')S.subjects=String(v).split(',').map(s=>s.trim()).filter(Boolean);
    else setPath(t.dataset.bind,v);
    apply();isStaff()?persist():render();
  }else if(t.dataset.c){
    S[t.dataset.c][+t.dataset.i][t.dataset.f]=v;isStaff()?persist():render();
    if((t.dataset.c==='questions'||t.dataset.c==='courses')&&t.dataset.f==='subject'){S[t.dataset.c][+t.dataset.i].chapter='';persist();render()}
  }
});

setInterval(()=>{
  if(!run||run.view!=='take'||!run.end)return;
  const left=run.end-Date.now(),el=$('#tmr');if(el)el.textContent=fmtT(left);
  if(left<=0){toast('Time is up');finishRun()}
},1000);
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const i=e.target.id;if(i==='lp')A[ui.lt==='admin'?'alogin':'login']();else if(i==='fpu')A.fpsend();else if(i==='fpo')A.fpverify();else if(i==='fpp2')A.fpreset();else if(i==='sp')A.setup();else if(i==='cp2')A.signup()});
async function brandLogin(){
  try{const r=await fetch('/api/brand');if(!r.ok)return;const b=await r.json();
    if(b.name&&b.done){S.brand.name=b.name;S.brand.short=b.short||S.brand.short;S.brand.logo=b.logo||'';['c1','c2','c3','acc'].forEach(k=>{if(b[k])S.brand[k]=b[k]})}}catch(e){}
}

(async function boot(){
  const ok=await hydrate();
  if(!ok){try{const r=await fetch('/api/health');const j=await r.json();needsSetup=(j.hasAdmin===false)}catch(e){needsSetup=false}}
  const a=me();
  if(ok&&a){S=buildS(a);ui.tab=firstTab()}
  else{S=seed();S.route='login';await brandLogin()}
  apply();render();
  if(S.route==='login'){try{speechSynthesis.getVoices()}catch(e){}setTimeout(()=>loginSpeak(),500)}
})();
</script>
