<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Student Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--c1:#7c2ddb;--c2:#e8399b;--c3:#ff7a1a;--acc:#f97316;--bg:#faf6f1;--card:#fff;--ink:#17141f;--mut:#8b8478;--line:#efe7dd;--tint:#f4efe8;--ok:#12a36b;--bad:#e5484d;--warn:#d99a00}
html[data-dark]{--bg:#14121a;--card:#1d1a26;--ink:#f3f0fa;--mut:#9a94ab;--line:#2c2838;--tint:#262232}
*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:12px 14px}
.top h1{font-size:17px;font-weight:700;flex:1;margin-left:6px}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.ib:active{background:var(--tint)}
main{flex:1;padding:16px 16px 76px;display:flex;flex-direction:column;gap:14px}
.foot{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--card);border-top:1px solid var(--line);text-align:center;font-size:12px;color:var(--mut);padding:13px;z-index:10}
.foot b{background:linear-gradient(90deg,var(--c1),var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.hero{border-radius:20px;padding:20px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2) 55%,var(--c3));display:grid;grid-template-columns:1fr 128px;gap:12px;box-shadow:0 10px 28px -12px var(--c2)}
.hero .date{font-size:11px;letter-spacing:.06em;opacity:.8;grid-column:1/-1}
.hero h2{font-size:26px;line-height:1.1;font-weight:800;margin:2px 0 8px}
.hero p{font-size:13px;opacity:.92;line-height:1.45}
.hero .acts{display:flex;flex-direction:column;gap:8px;align-items:flex-start;margin-top:14px}
.hero .side{display:flex;flex-direction:column;gap:10px}
.glass{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:14px;padding:10px 12px}
.glass small{display:block;font-size:10px;opacity:.85;letter-spacing:.04em}
.glass b{display:block;font-size:22px;margin-top:2px}
.glass i{font-style:normal;font-size:11px;opacity:.85}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border-radius:11px;font-weight:700;font-size:13px;background:var(--acc);color:#fff}
.btn.white{background:#fff;color:#b8400a}
.btn.ghost{background:rgba(255,255,255,.22);color:#fff;border:1px solid rgba(255,255,255,.35)}
.btn.line{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:12px}
.btn:disabled{opacity:.45}
.stat{display:flex;flex-direction:column;gap:6px}
.stat .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;margin-bottom:6px}
.stat b{font-size:30px;font-weight:800;line-height:1}
.stat span{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.04em;text-transform:uppercase}
.stat small{font-size:12px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sec{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sec h3{font-size:16px;font-weight:700}
.link{color:var(--acc);font-weight:700;font-size:13px}
.big{text-align:center;padding:6px 0}
.big b{font-size:44px;font-weight:800;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--tint);color:var(--mut)}
.pill.ok{background:#e3f6ee;color:var(--ok)}.pill.bad{background:#fdeaea;color:var(--bad)}.pill.warn{background:#fff3d6;color:var(--warn)}.pill.pu{background:#efe8fc;color:var(--c1)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:10px}
.mini b{display:block;font-size:22px}.mini span{font-size:11px;color:var(--mut)}
.bar{height:8px;border-radius:9px;background:var(--tint);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--ok)}
.kv{display:flex;justify-content:space-between;font-size:13px;margin:10px 0 6px}
.ring{--p:70;--col:var(--ok);width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--col) calc(var(--p)*1%),var(--tint) 0);display:grid;place-items:center;flex:none}
.ring span{width:35px;height:35px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:11px;font-weight:800}
.trow{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0;padding-top:4px}
.trow h4{font-size:15px;font-weight:700}
.trow p{font-size:12px;color:var(--mut);margin:3px 0 8px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.search{display:flex;gap:8px}
.search label{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--mut)}
.search input{border:0;background:none;outline:0;padding:11px 0;width:100%;font-size:14px}
.chips{display:flex;gap:8px;overflow:auto;padding-bottom:2px}
.chip{padding:7px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:700;white-space:nowrap;color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pager{display:flex;justify-content:center;align-items:center;gap:14px;font-size:13px;color:var(--mut);padding-top:12px;border-top:1px solid var(--line)}
.cover{height:130px;border-radius:12px;background:linear-gradient(135deg,var(--c1),var(--c2) 60%,var(--c3));display:flex;align-items:flex-end;padding:12px;color:#fff;font-weight:800;font-size:22px;margin-bottom:12px;position:relative}
.cover em{position:absolute;top:10px;left:10px;font-style:normal;font-size:11px;font-weight:700;background:rgba(255,255,255,.25);padding:3px 9px;border-radius:99px}
.person{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin:6px 0 10px}
.av{width:26px;height:26px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.folder{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.folder .fi{width:38px;height:38px;border-radius:10px;background:#fff0e3;color:var(--acc);display:grid;place-items:center;flex:none}
.folder b{display:block;font-size:14px}.folder small{color:var(--mut);font-size:12px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.lrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.rk{width:30px;height:30px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.lrow.me{background:#fff3e8;margin:0 -8px;padding:11px 8px;border-radius:10px}
html[data-dark] .lrow.me{background:#2d2231}
.gold{background:linear-gradient(135deg,#fff8e1,#fff1c7);border-color:#f1d36b;color:#3b2f00}
.q h3{font-size:18px;line-height:1.35;margin:10px 0 16px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:13px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--card);font-size:14px}
.opt i{width:26px;height:26px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px;flex:none}
.opt.sel{border-color:var(--acc);background:#fff3e8;color:#17141f}
.opt.right{border-color:var(--ok);background:#e3f6ee;color:#0d6e49}
.opt.wrong{border-color:var(--bad);background:#fdeaea;color:#a02126}
.empty{text-align:center;color:var(--mut);padding:28px 10px;font-size:14px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;font-size:12px;font-weight:700;color:var(--mut)}
.f input:not([type=checkbox]):not([type=color]),.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:500;color:var(--ink);width:100%}
.f input[type=color]{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:3px}
.sw{display:flex;align-items:center;gap:10px;font-size:14px;padding:8px 0}
.sw input{width:18px;height:18px;accent-color:var(--acc)}
.ov{position:fixed;inset:0;background:rgba(10,8,18,.5);z-index:40;display:flex;justify-content:flex-start}
.drawer{width:292px;max-width:84%;background:var(--card);height:100%;display:flex;flex-direction:column;animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(-100%)}}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;background:linear-gradient(90deg,var(--c1),var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .lg{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--c1),var(--c3));display:grid;place-items:center;color:#fff;font-size:11px;-webkit-text-fill-color:#fff}
.logo img{width:30px;height:30px;border-radius:9px;object-fit:cover}
.nav{flex:1;overflow:auto;padding:10px}
.nav button{display:flex;gap:14px;align-items:center;width:100%;padding:12px;border-radius:11px;font-size:14px;font-weight:600;color:var(--mut);text-align:left}
.nav button.on{background:#fff0e3;color:var(--acc)}
html[data-dark] .nav button.on{background:#32232a}
.me-box{display:flex;gap:11px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);font-size:13px}
.me-box small{display:block;color:var(--mut);font-size:11px;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.ava{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.sheet{position:fixed;inset:auto 0 0 0;margin:0 auto;max-width:520px;height:92dvh;background:var(--card);border-radius:22px 22px 0 0;z-index:50;display:flex;flex-direction:column;animation:up .24s ease-out}
@keyframes up{from{transform:translateY(100%)}}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 8px}
.sheet .sh h2{font-size:18px}
.tabs{display:flex;gap:6px;overflow:auto;padding:4px 18px 10px;border-bottom:1px solid var(--line)}
.sb{flex:1;overflow:auto;padding:16px 18px 30px}
.rowed{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.rowed .rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:var(--mut);font-size:12px}
.rowed .rh button{color:var(--bad);padding:4px}
.hint{font-size:12px;color:var(--mut);margin:0 0 12px;line-height:1.5}
textarea.code{min-height:150px;font-family:ui-monospace,monospace;font-size:12px}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:#17141f;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:70;max-width:86%;text-align:center}
.login{min-height:100dvh;display:grid;place-items:center;padding:24px}
.login .card{width:100%;max-width:380px;padding:26px}
.login h2{font-size:24px;margin:16px 0 4px}
.login p{color:var(--mut);font-size:14px;margin-bottom:18px}
@media (prefers-reduced-motion:reduce){.drawer,.sheet{animation:none}}
@media (max-width:360px){.hero{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<div id="pnl"></div>
<div id="tst"></div>

<script>
/* ============ ICONS ============ */
const ICON={
menu:'M4 6h16M4 12h16M4 18h16',moon:'M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z',
bell:'M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0',
gear:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z',
dashboard:'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z',book:'M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z',
bolt:'M13 2 3 14h9l-1 8 10-12h-9z',file:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h8',
chart:'M18 20V10M12 20V4M6 20v-6',trophy:'M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3',
chat:'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z',note:'M4 4h16v16H4zM8 9h8M8 13h8M8 17h5',
video:'M23 7l-7 5 7 5zM1 5h15v14H1z',paper:'M2 4h7a3 3 0 0 1 3 3v14a2 2 0 0 0-2-2H2zM22 4h-7a3 3 0 0 0-3 3v14a2 2 0 0 1 2-2h8z',
mail:'M4 4h16v16H4zM4 6l8 7 8-7',logout:'M9 21H5V3h4M16 17l5-5-5-5M21 12H9',folder:'M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',
x:'M18 6 6 18M6 6l12 12',plus:'M12 5v14M5 12h14',trash:'M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14',search:'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3',
refresh:'M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5',eye:'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
check:'M20 6 9 17l-5-5',target:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12zM12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z',
clock:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6v6l4 2',grid:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',list:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',
left:'M15 18l-6-6 6-6',right:'M9 18l6-6-6-6'};
const I=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICON[n]||''}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const fmtDate=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});

/* ============ DEFAULT DATA (sab kuch customize ho sakta hai) ============ */
function seed(){
  return{
  brand:{name:'My Academy',short:'MA',logo:'',c1:'#7c2ddb',c2:'#e8399b',c3:'#ff7a1a',acc:'#f97316',dark:false,footer:'All rights reserved.'},
  user:{name:'Student',email:'',points:0,level:'Beginner',hours:'0h',weekly:0},
  route:'dashboard',
  menu:[
    {id:'dashboard',label:'Dashboard',icon:'dashboard',on:true},{id:'courses',label:'My Courses',icon:'book',on:true},
    {id:'create',label:'Create Practice Test',icon:'bolt',on:true},{id:'history',label:'Test History',icon:'file',on:true},
    {id:'reports',label:'My MCQ Reports',icon:'chart',on:true},{id:'leaderboard',label:'Leaderboard',icon:'trophy',on:true},
    {id:'community',label:'Community',icon:'chat',on:true},{id:'notes',label:'Notes',icon:'note',on:true},
    {id:'videos',label:'Videos',icon:'video',on:true},{id:'papers',label:'Past Papers',icon:'paper',on:true},
    {id:'messages',label:'Messages',icon:'mail',on:true}],
  subjects:[],assigned:[],courses:[],folders:[],papers:[],notes:[],messages:[],board:[],posts:[],
  community:{replies:0,helpful:0},tests:[],questions:[]
  };
}
let S=seed();
let ui={drawer:false,panel:false,tab:'brand',col:'courses',hp:1,hf:'All',hq:'',vq:'',vgrid:true,lb:'All',qf:'All',qlim:15};
let run=null;

/* ============ ONLINE DATABASE/API ============ */
const API_BASE='';
const OWNED=['assigned','courses','folders','papers','notes','messages','questions'];
const GLOBAL=['brand','menu','subjects','board'];
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const newDB=()=>{const x=seed(),sh={};GLOBAL.concat(OWNED).forEach(k=>sh[k]=x[k]);sh.posts=x.posts;return{v:1,accounts:[],shared:sh,progress:{},session:null}};
let DB=newDB();
let onlineReady=false, saveTimer=null, needsSetup=false;
async function api(path,opts={}){const r=await fetch(API_BASE+path,{credentials:'include',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.error||'Network request failed');return d}
async function hydrate(){try{const d=await api('/api/state');DB=d;onlineReady=true;return true}catch(e){onlineReady=false;return false}}
function saveDB(){ if(!onlineReady)return; clearTimeout(saveTimer); saveTimer=setTimeout(async()=>{try{const a=me();if(!a)return;if(a.role==='admin')await api('/api/admin/shared',{method:'PUT',body:JSON.stringify({data:DB.shared})});else await api('/api/progress',{method:'PUT',body:JSON.stringify({data:DB.progress[a.id]||{}})});}catch(e){console.warn(e)}},350); }
async function saveNow(){clearTimeout(saveTimer);if(!onlineReady)return;const a=me();if(!a)return;if(a.role==='admin')await api('/api/admin/shared',{method:'PUT',body:JSON.stringify({data:DB.shared})});else await api('/api/progress',{method:'PUT',body:JSON.stringify({data:DB.progress[a.id]||{}})});}
const me=()=>DB.accounts.find(a=>a.id===DB.session)||null;
const role=()=>me()?.role||'';
const isStaff=()=>role()==='admin';
const isDark=()=>role()!=='admin'&&S.user&&S.user.dark!==undefined?S.user.dark:S.brand.dark;
const ckeys=()=>OWNED.concat('board');
const GRADES=['Class 1','Class 2','Class 3','Class 4','Class 5','Class 6','Class 7','Class 8','Class 9','Matric'];
const gradeSel=(at,cur,blank)=>`<select ${at}><option value="">${blank}</option>${GRADES.map(g=>`<option ${cur===g?'selected':''}>${g}</option>`).join('')}</select>`;
/* Student ko ye item dikhna chahiye ya nahi (class/student assign) */
function visibleTo(i,acc){
  const to=i.to||'all';
  if(to.startsWith('grade:'))return acc.grade===to.slice(6);
  if(to.startsWith('stu:'))return to.slice(4)===acc.id;
  return true;
}
function toOptions(){
  const o=[['all','All students']];
  GRADES.forEach(g=>o.push(['grade:'+g,g+' (whole class)']));
  DB.accounts.filter(a=>a.role==='student').forEach(a=>o.push(['stu:'+a.id,a.name+(a.grade?' ('+a.grade+')':'')]));
  return o;
}
function hintAssigned(row){
  const have=S.questions.filter(q=>q.subject===row.subject&&q.q).length,need=+row.count||0;
  return `<p class="hint" style="margin:0">The bank has ${have} MCQs in ${esc(row.subject)}. ${need>have?'Add '+(need-have)+' more MCQs, or lower the number above.':'Students get '+need+' random MCQs from them.'}</p>`;
}
const firstTab=()=>'accounts';
function chkAcc(n,u,p){
  if(!n)return 'Enter a name';
  if(!/^[a-z0-9_.-]{3,20}$/.test(u))return 'Username: 3-20 letters, numbers, dot, dash or underscore';
  if(DB.accounts.some(a=>a.username===u))return 'That username is already taken';
  if(!/^(?=.{10,128}$)(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[^A-Za-z0-9]).*$/.test(p))return 'Password must be 10+ characters with uppercase, lowercase, number and symbol';
  return '';
}
/* Login karne walay ke hisaab se S (screen ka data) banata hai */
function buildS(acc){
  const sh=DB.shared,x=seed();
  GLOBAL.forEach(k=>x[k]=clone(sh[k]));
  x.posts=clone(sh.posts||[]);
  OWNED.forEach(k=>{
    let l=sh[k]||[];
    if(acc.role==='student'&&k!=='questions')l=l.filter(i=>visibleTo(i,acc));
    x[k]=clone(l);
  });
  const pr=DB.progress[acc.id]||{};
  x.user=Object.assign(x.user,pr.user||{},{name:acc.name,email:({admin:'Admin',student:'Student'})[acc.role]+' - @'+acc.username+(acc.grade?' - '+acc.grade:'')});
  x.tests=clone(pr.tests||[]);x.community=pr.community||{replies:0,helpful:0};
  x.route=acc.role==='student'?'dashboard':'home';
  return x;
}
/* Screen ka data wapas database mein save karta hai (role ke hisaab se) */
function persist(){
  const a=me();if(!a)return;
  const sh=DB.shared;
  if(a.role==='admin'){GLOBAL.concat(OWNED).forEach(k=>sh[k]=clone(S[k]))}
  else{DB.progress[a.id]={user:clone(S.user),tests:clone(S.tests),community:clone(S.community)};sh.posts=clone(S.posts)}
  saveDB();
}
async function doLogin(adminOnly){
  const u=$('#lu').value.trim().toLowerCase(),p=$('#lp').value.trim();
  try{const d=await api('/api/login',{method:'POST',body:JSON.stringify({username:u,password:p,adminOnly})});DB=d;onlineReady=true;run=null;nav.length=0;const a=me();S=buildS(a);ui.panel=false;ui.drawer=false;ui.tab=firstTab();ui.col='courses';apply();renderPanel();render();}
  catch(e){toast(e.message)}
}
function signIn(a){DB.session=a.id;run=null;nav.length=0;S=buildS(a);ui.panel=false;ui.drawer=false;ui.tab=firstTab();ui.col='courses';apply();renderPanel();render();}
/* Admin accounts badalta hai: pehle save, phir badlav, phir screen dobara banao */
function accOp(fn){
  persist();fn();saveDB();
  const r=S.route;S=buildS(me());S.route=r;
  renderPanel();render();
}

/* ============ HELPERS ============ */
const done=()=>S.tests.filter(t=>t.status!=='In Progress');
const stats=()=>{const d=done();const c=d.reduce((a,t)=>a+t.correct,0),n=d.reduce((a,t)=>a+t.total,0);
  return{completed:d.length,progress:S.tests.length-d.length,solved:n,correct:c,wrong:n-c,acc:n?Math.round(c/n*1000)/10:0,avg:d.length?Math.round(d.reduce((a,t)=>a+t.correct/t.total*100,0)/d.length):0}};
const rank=()=>1+S.board.filter(b=>b.score>S.user.points).length;
const total=()=>S.board.length+1;
const topPct=()=>Math.round(rank()/total()*1000)/10;
const initials=n=>String(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const rcol=p=>p>=75?'var(--ok)':p>=60?'var(--acc)':'var(--bad)';
const ring=(p)=>`<div class="ring" style="--p:${p};--col:${rcol(p)}"><span>${p}%</span></div>`;
function toast(m){const t=$('#tst');t.innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>t.innerHTML='',2200)}
function apply(){const r=document.documentElement.style,b=S.brand;
  r.setProperty('--c1',b.c1);r.setProperty('--c2',b.c2);r.setProperty('--c3',b.c3);r.setProperty('--acc',b.acc);
  isDark()?document.documentElement.setAttribute('data-dark',''):document.documentElement.removeAttribute('data-dark');
  document.title=b.name+' - Student Portal'}
/* ============ BACK NAVIGATION (app ka back button + phone ka back button) ============ */
const nav=[];let hOK=true;
const histPush=()=>{try{history.pushState({p:1},'')}catch(e){hOK=false}};
const go=r=>{if(r!==S.route){nav.push(S.route);histPush()}S.route=r;ui.drawer=false;window.scrollTo(0,0);render()};
function goBack(){
  if(ui.panel){ui.panel=false;renderPanel();histPush();return}
  if(ui.drawer){ui.drawer=false;render();histPush();return}
  if(S.route==='run'&&run&&run.view==='take'){
    if(confirm('Quit this test? Your answers will be lost.')){run=null;S.route=nav.pop()||'dashboard';window.scrollTo(0,0);render()}else histPush();
    return;
  }
  if(nav.length){S.route=nav.pop();window.scrollTo(0,0);render()}
}
window.addEventListener('popstate',()=>{if(S.route!=='login')goBack()});
const titleOf=r=>({dashboard:'',run:'Practice Test',review:'Review'}[r]??(S.menu.find(m=>m.id===r)?.label||''));

function testRow(t,solo){
  const p=t.status==='In Progress'?Math.round(t.correct/t.total*100):Math.round(t.correct/t.total*100);
  const pill=t.status==='Passed'?'<span class="pill ok">Passed</span>':t.status==='Failed'?'<span class="pill bad">Failed</span>':'<span class="pill warn">In Progress</span>';
  return `<div class="trow">${ring(p)}<div style="flex:1;min-width:0"><div class="tags"><h4>${esc(t.title)}</h4>${pill}</div>
    <p>${t.status==='In Progress'?`${t.correct}/${t.total} answered`:`${t.correct}/${t.total} correct`} &middot; ${esc(t.bank)}</p>
    <div class="tags"><span class="pill pu">${esc(t.subject)}</span><span class="pill">${esc(t.date)}</span></div>
    <div class="acts"><button class="btn line sm" data-a="review" data-id="${esc(t.id)}">${I('chart',14)} Results</button>
    <button class="btn line sm" data-a="review" data-id="${esc(t.id)}">${I('eye',14)} Review</button>
    <button class="btn sm" data-a="retake" data-id="${esc(t.id)}">Retake</button></div></div></div>`;
}

function pgRun(){
  if(!run)return `<div class="empty"><b>No test running</b></div>`;
  if(run.view==='result'){
    const t=run.t,p=Math.round(t.correct/t.total*100);
    return `<div class="card" style="text-align:center"><div style="display:flex;justify-content:center;margin-bottom:12px"><div class="ring" style="--p:${p};--col:${rcol(p)};width:96px;height:96px"><span style="width:76px;height:76px;font-size:22px">${p}%</span></div></div>
    <h2 style="font-size:22px">${t.status==='Passed'?'Test passed':'Keep practising'}</h2>
    <p class="hint" style="margin-top:6px">${t.correct} correct, ${t.total-t.correct} wrong out of ${t.total}. You earned ${t.correct} points.</p>
    <div class="acts" style="justify-content:center"><button class="btn" data-a="review" data-id="${esc(t.id)}">Review answers</button><button class="btn line" data-a="go" data-r="history">Test history</button></div></div>`;
  }
  const q=run.qs[run.i],sel=run.ans[run.i],last=run.i===run.qs.length-1;
  return `<div class="card q"><div class="kv" style="margin:0 0 8px"><span>${esc(run.subject)} ${run.end?`<span class="pill warn" id="tmr">${fmtT(run.end-Date.now())}</span>`:''}</span><b>${run.i+1} / ${run.qs.length}</b></div>

  <button class="btn" data-a="next" ${sel?'':'disabled'}>${last?'Finish':'Next'}</button></div></div>`;
}

const fld=(l,attrs,v,t='text')=>`<label class="f"><span>${l}</span><input type="${t}" ${attrs} value="${esc(v)}"></label>`;
function splitLine(line){
  if(line.includes('|'))return line.split('|');
  if(line.includes('\t'))return line.split('\t');
  const out=[];let cur='',q=false;
  for(const ch of line){if(ch==='"')q=!q;else if(ch===','&&!q){out.push(cur);cur=''}else cur+=ch}
  out.push(cur);return out;
}
function importMCQs(text,defSub){
  let ok=0,bad=0;
  String(text).split(/\r?\n/).forEach(line=>{
    line=line.trim();if(!line)return;
    let p=splitLine(line).map(x=>x.trim());
    if(p.length===6)p.unshift(defSub);
    if(p.length<7){bad++;return}
    const [sub,q,a,b,c,d,r]=p;const k=String(r).trim().toUpperCase();
    const n='ABCD'.indexOf(k)+1||parseInt(k);
    if(!sub||!q||!a||!b||!c||!d||!(n>=1&&n<=4)){bad++;return}
    if(!S.subjects.includes(sub))S.subjects.push(sub);
    S.questions.push({subject:sub,q,o1:a,o2:b,o3:c,o4:d,ans:n});ok++;
  });
  return{ok,bad};
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startRun(subject,n,bank,minutes,cap){
  const pool=shuffle(S.questions.filter(q=>q.subject===subject&&q.q));
  if(!pool.length){toast('No MCQs for '+subject+'. '+(isStaff()?'Add some in the panel > Content > Question bank.':'Ask your admin to add some.'));return}
  if(n>pool.length){
    if(!cap){toast('Only '+pool.length+' MCQs in '+subject+', but '+n+' needed. '+(isStaff()?'Add more in the panel > Content > Question bank > Import MCQs.':'Ask your admin to add more.'));return}
    toast('Bank has only '+pool.length+' MCQs for '+subject+'. Starting with '+pool.length+'.');n=pool.length;
  }
  run={subject,bank,qs:pool.slice(0,Math.max(1,n)),i:0,ans:[],view:'take',end:minutes>0?Date.now()+minutes*60000:0};
  go('run');
}
function finishRun(){
  S.route='run';
  const correct=run.qs.reduce((a,q,i)=>a+(run.ans[i]===q.ans?1:0),0),n=run.qs.length;
  const nums=S.tests.map(t=>parseInt(String(t.id).replace(/\D/g,''))||0);
  const id='Test'+(Math.max(10000,...nums)+1);
  const t={id,title:id,subject:run.subject,bank:run.bank,total:n,correct,date:fmtDate(new Date()),status:correct/n>=.5?'Passed':'Failed',qs:run.qs,ans:run.ans.slice()};
  S.tests.unshift(t);S.user.points+=correct;run.t=t;run.view='result';render();
}
const A={
  go:d=>go(d.r),back:()=>{if(hOK)history.back();else goBack()},drawer:()=>{ui.drawer=!ui.drawer;if(ui.drawer)histPush();render()},
  dark:()=>{if(role()==='admin')S.brand.dark=!S.brand.dark;else S.user.dark=!isDark();apply();renderPanel();persist()},
  bell:()=>toast(S.messages.length?`${S.messages.length} messages. Latest: ${S.messages[0].text}`:'No new notifications'),
  panel:()=>{if(!isStaff())return;ui.panel=!ui.panel;if(ui.panel)histPush();renderPanel()},tab:d=>{ui.tab=d.v;renderPanel()},col:d=>{ui.col=d.v;renderPanel()},
  hf:d=>{ui.hf=d.v;ui.hp=1;render()},hp:d=>{ui.hp+=+d.v;render()},lb:d=>{ui.lb=d.v;render()},vgrid:()=>{ui.vgrid=!ui.vgrid;render()},
  start:()=>startRun($('#cs').value,Math.max(1,parseInt($('#cn').value)||5),$('#cb').value||'Practice Test',Math.max(0,parseInt($('#ct').value)||0),false),
  startAssigned:d=>{const a=S.assigned[+d.i];if(a)startRun(a.subject,Math.max(1,+a.count||1),a.title,Math.max(0,+a.minutes||0),false)},
  qmore:()=>{ui.qlim+=15;renderPanel()},
  qadd:()=>{const g=i=>$(i).value.trim(),sub=g('#qa_sub'),q=g('#qa_q'),o=[1,2,3,4].map(i=>g('#qa_'+i)),ans=+$('#qa_ans').value||1;
    if(!sub||!q||o.some(x=>!x)){toast('Fill the subject, the question and all four options');return}
    if(!S.subjects.includes(sub))S.subjects.push(sub);
    S.questions.unshift({subject:sub,q,o1:o[0],o2:o[1],o3:o[2],o4:o[3],ans});ui.qsub=sub;ui.qlim=15;
    toast('MCQ saved. '+sub+' now has '+availOf(sub)+' MCQs');render()},
  sg:d=>{ui.sg=d.v;render()},
  bulk:()=>{const r=importMCQs($('#bulk').value,$('#bsub').value);$('#bulk').value='';ui.qlim=15;toast(r.ok+' MCQs imported'+(r.bad?', '+r.bad+' lines skipped':''));renderPanel();render()},
  pick:d=>{run.ans[run.i]=+d.v;render()},
  next:()=>{if(run.i<run.qs.length-1){run.i++;render()}else finishRun()},
  quit:()=>{run=null;go('create')},
  review:d=>{const t=S.tests.find(x=>x.id===d.id);if(!t?.qs){toast('Review is available for tests taken in this portal');return}run={rid:t.id};go('review')},
  retake:d=>{const t=S.tests.find(x=>x.id===d.id);if(t)startRun(t.subject,t.total,t.bank,0,true)},
  post:async()=>{const v=$('#np').value.trim();if(!v){toast('Write something first');return}try{const d=await api('/api/posts',{method:'POST',body:JSON.stringify({text:v})});S.posts=d.posts;DB.shared.posts=clone(d.posts);render()}catch(e){toast(e.message)}},
  open:d=>window.open(d.u,'_blank','noopener'),soft:()=>toast(isStaff()?'Add a link for this item in the panel > Content':'No link added for this yet'),
  logout:async()=>{try{await saveNow();await api('/api/logout',{method:'POST'})}catch(e){}DB=newDB();onlineReady=false;run=null;nav.length=0;ui.drawer=false;ui.panel=false;ui.lt='login';S=seed();S.route='login';apply();renderPanel();render()},
  ltab:d=>{ui.lt=d.v;renderLogin()},
  login:()=>doLogin(false),alogin:()=>doLogin(true),
  signup:async()=>{toast('Student self-registration is disabled. Ask your Admin to create your account.');return;/*const n=$('#cn').value.trim(),u=$('#cu').value.trim().toLowerCase(),p=$('#cp').value.trim();
    if(p!==$('#cp2').value.trim()){toast('The two PINs do not match');return}
    const err=chkAcc(n,u,p);if(err){toast(err);return}
    const g=$('#cg').value;if(!g){toast('Choose your class');return}
    try{const d=await api('/api/signup',{method:'POST',body:JSON.stringify({name:n,username:u,pin:p,grade:g})});DB=d;onlineReady=true;const a=me();S=buildS(a);ui.lt='login';apply();renderPanel();render();toast('Account created and signed in')}catch(e){toast(e.message)}}*/},
  add:d=>{const b=clone(SCHEMA[d.c].blank);S[d.c].unshift(b);renderPanel();render()},
  del:d=>{S[d.c].splice(+d.i,1);renderPanel();render()},
  copy:()=>{const j=JSON.stringify(DB,null,1);(navigator.clipboard?navigator.clipboard.writeText(j):Promise.reject()).then(()=>toast('Backup copied')).catch(()=>toast('Copy blocked. Use Download backup'))},
  download:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,1)],{type:'application/json'}));a.download='portal-database.json';a.click();toast('Backup downloaded')},
  import:()=>toast('Online restore requires a server backup with password hashes. Use Download backup for a safe export.'),
  reset:()=>toast('For the online version, reset is disabled to protect the live database.'),
  setup:async()=>{const n=$('#sn').value.trim(),u=$('#su').value.trim().toLowerCase(),p=$('#sp').value,err=chkAcc(n,u,p);
    if(err){toast(err);return}
    try{const d=await api('/api/setup',{method:'POST',body:JSON.stringify({name:n,username:u,password:p})});DB=d;onlineReady=true;needsSetup=false;const a=me();S=buildS(a);ui.lt='admin';apply();renderPanel();render();toast('Admin account created')}catch(e){toast(e.message)}},
  
  addacc:async()=>{const n=$('#an').value.trim(),u=$('#au').value.trim().toLowerCase(),p=$('#ap').value,r=$('#ar').value==='admin'?'admin':'student',g0=$('#ag').value,err=chkAcc(n,u,p);
    if(err){toast(err);return}
    try{await api('/api/admin/accounts',{method:'POST',body:JSON.stringify({name:n,username:u,password:p,role:r,grade:r==='student'?g0:''})});DB=await api('/api/state');toast('Account created for '+n);renderPanel();render()}catch(e){toast(e.message)}},
  setpin:async d=>{const a=DB.accounts.find(x=>x.id===d.id);if(!a||!isStaff())return;
    const p=prompt('New strong password for '+a.name)||'';if(!p)return;
    if(!/^(?=.{10,128}$)(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[^A-Za-z0-9]).*$/.test(p)){toast('Password must be 10+ characters with uppercase, lowercase, number and symbol');return}
    try{await api('/api/admin/accounts/'+encodeURIComponent(a.id),{method:'PATCH',body:JSON.stringify({password:p})});toast('Password changed for '+a.name)}catch(e){toast(e.message)}},
  delacc:async d=>{const a=DB.accounts.find(x=>x.id===d.id);if(!a||a.id===DB.session)return;
    if(a.role==='admin'&&DB.accounts.filter(x=>x.role==='admin').length<2){toast('Keep at least one Admin');return}
    if(!confirm('Delete '+a.name+'?'+(a.role==='student'?' Their results are removed.':'')))return;
    try{await api('/api/admin/accounts/'+encodeURIComponent(a.id),{method:'DELETE'});DB=await api('/api/state');renderPanel();render();toast('Account deleted')}catch(e){toast(e.message)}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.disabled)return;if(t.classList.contains('ov')&&e.target!==t)return;A[t.dataset.a]?.(t.dataset,e)});

function setPath(p,v){const k=p.split('.');let o=S;while(k.length>1)o=o[k.shift()];o[k[0]]=v}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.acct){const a=DB.accounts.find(x=>x.id===t.dataset.acct);if(a){a.grade=t.value;api('/api/admin/accounts/'+encodeURIComponent(a.id),{method:'PATCH',body:JSON.stringify({grade:t.value})}).catch(e=>toast(e.message));}return}
  if(t.id==='qfile'&&t.files[0]){const f=t.files[0],r=new FileReader();r.onload=()=>{const x=importMCQs(r.result,$('#bsub').value);toast(x.ok+' MCQs imported'+(x.bad?', '+x.bad+' lines skipped':''));renderPanel();render()};r.readAsText(f)}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='cs'){const n=availOf(t.value);const c=$('#cn');c.max=n;if(+c.value>n)c.value=n||1;$('#avh').textContent=n+' MCQs available in '+t.value;return}
  if(t.id==='qfsel'){ui.qf=t.value;ui.qlim=15;renderPanel();return}
  if(t.id==='hq'){ui.hq=t.value;ui.hp=1;ui.keepHq=true;render();return}
  if(t.id==='vq'){ui.vq=t.value;ui.keepVq=true;render();return}
  const v=t.type==='checkbox'?t.checked:t.type==='number'?(t.value===''?0:+t.value):t.value;
  if(t.dataset.bind){
    if(t.dataset.bind==='subjects')S.subjects=String(v).split(',').map(s=>s.trim()).filter(Boolean);
    else setPath(t.dataset.bind,v);
    apply();isStaff()?persist():render();
  }else if(t.dataset.c){
    S[t.dataset.c][+t.dataset.i][t.dataset.f]=v;isStaff()?persist():render();
  }
});

setInterval(()=>{
  if(!run||run.view!=='take'||!run.end)return;
  const left=run.end-Date.now(),el=$('#tmr');if(el)el.textContent=fmtT(left);
  if(left<=0){toast('Time is up');finishRun()}
},1000);
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const i=e.target.id;if(i==='lp')A[ui.lt==='admin'?'alogin':'login']();else if(i==='sp')A.setup();else if(i==='cp2')A.signup()});
(async function boot(){
  const ok=await hydrate();
  if(!ok){try{const r=await fetch('/api/health');const j=await r.json();needsSetup=(j.hasAdmin===false)}catch(e){needsSetup=false}}
  const a=me();
  if(ok&&a){S=buildS(a);ui.tab=firstTab()}
  else{S=seed();S.route='login'}
  apply();render();
})();
</script>
</body>
</html>
